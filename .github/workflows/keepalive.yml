name: keepalive

# GitHub tự tắt scheduled workflow nếu repo không có commit trong 60 ngày.
# Workflow này tạo 1 commit nhỏ mỗi tháng để sync không bị tắt âm thầm.

on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ghi mốc thời gian
        run: date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "chore: keepalive $(date -u +%Y-%m)" || exit 0
          git push
