# ---------------------------------------------------------------------------
# Deploy Next.js 15 (App Router, SSR) lên Netlify.
#
# Build: `next build` (Node runtime). Bước kế tiếp `publish` ra `.next`
# và mọi request được Netlify server-side render (xây dựng framework preset).
# ---------------------------------------------------------------------------

[build]
command = "next build"
publish = ".next"

[build.environment]
NODE_VERSION = "20"
NEXT_RUNTIME = "nodejs"
# Env có thể định nghĩa ở Netlify Settings > Variables (khuyên dùng)
NEXT_PUBLIC_SUPABASE_URL = "${SUPABASE_URL}"
NEXT_PUBLIC_SUPABASE_ANON_KEY = "${SUPABASE_ANON_KEY}"
SITE_URL = "${SITE_URL}"

[[redirects]]
from = "/admin/*"
to = "/admin/:splat"
status = 200

[[redirects]]
from = "/api/*"
to = "/api/:splat"
status = 200

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[headers]]
for = "/_next/static/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
X-Frame-Options = "DENY"
X-XSS-Protection = "1; mode=block"
Referrer-Policy = "strict-origin-when-cross-origin"
