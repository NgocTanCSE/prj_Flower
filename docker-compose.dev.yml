# ---------------------------------------------------------------------------
# Chạy dự án ứng dụng (Next.js 15) ở chế độ DEVELOPMENT:
#   - build qua `Dockerfile.dev` (chỉ cài dependencies; không build)
#   - hot reload khi code thay đổi (bind mount nguồn vào /app)
#   - .next cache (hỗ trợ Next.js)
#   - Postgres + migration tự động + Adminer
# ---------------------------------------------------------------------------
name: tiemhoa

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: tiemhoa-app-dev:latest
    container_name: tiemhoa-app-dev
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    command: ["npm", "run", "dev"]
    volumes:
      - .:/app
      - dev-node-modules:/app/node_modules
      - dev-next-cache:/app/.next
    environment:
      - CHOKIDAR_USEPOLLING=true

  db:
    image: postgres:15-alpine
    container_name: tiemhoa-db-dev
    restart: unless-stopped
    # port host đổi thành 5433 vì 5432 đang bị container khác (pg) chiếm
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: tiemhoa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
      - ./docker/01_init_db.sh:/docker-entrypoint-initdb.d/01_init_db.sh:ro
      - ./supabase/migrations:/supabase_migrations:ro
    command: ["postgres", "-c", "max_connections=50", "-c", "shared_buffers=256MB"]

  adminer:
    image: adminer:4.8.1
    container_name: tiemhoa-adminer-dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: flat

volumes:
  postgres-dev-data:
  dev-node-modules:
  dev-next-cache:
