# ---------------------------------------------------------------------------
# Netlify + Next.js 15 (App Router, SSR)
#
# Next.js Runtime (@netlify/plugin-nextjs) chuyển App Router / Server Actions /
# API routes sang Netlify Functions. Không dùng redirect tĩnh kiểu SPA.
# ---------------------------------------------------------------------------

[build]
command = "next build"
publish = ".next"

[build.environment]
NODE_VERSION = "20"

[[plugins]]
package = "@netlify/plugin-nextjs"

[[headers]]
for = "/_next/static/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
X-Frame-Options = "DENY"
X-XSS-Protection = "1; mode=block"
Referrer-Policy = "strict-origin-when-cross-origin"
